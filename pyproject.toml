[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-prod-hardening"
version = "0.1.0"
description = "Hardening patterns for a multi-tenant AI API (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    # [http2]: installs `h2`, so the shared client can speak HTTP/2 (connection reuse and multiplexing).
    "httpx[http2]>=0.27",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "fakeredis[lua]>=2.23",
    "pyyaml>=6",
    "ruff>=0.4",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_prod_hardening"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p fastapi_prod_hardening.strict_skips -p pytester"
pythonpath = ["scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
